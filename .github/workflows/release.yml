name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.0, etc.

jobs:
  build-and-release:
    name: Build and Release
    runs-on: macos-latest

    permissions:
      contents: write  # Required to create releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show build environment
        run: |
          echo "Xcode version:"
          xcodebuild -version
          echo ""
          echo "Available SDKs:"
          xcodebuild -showsdks | grep macosx

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Stamp version into Info.plist
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" Iris/Iris/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" Iris/Iris/Info.plist
          plutil -lint Iris/Iris/Info.plist
          echo "Stamped version $VERSION into Info.plist"

      - name: Build Release
        run: |
          cd Iris
          xcodebuild \
            -project Iris.xcodeproj \
            -scheme Iris \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            clean build \
            CODE_SIGN_IDENTITY="-"

      - name: Verify build output
        run: |
          echo "Built app contents:"
          ls -la Iris/build/Build/Products/Release/
          echo ""
          echo "App bundle info:"
          cat Iris/build/Build/Products/Release/Iris.app/Contents/Info.plist | head -30

      - name: Create zip archive
        run: |
          cd Iris/build/Build/Products/Release
          zip -r -y "Iris-${{ github.ref_name }}.zip" Iris.app
          echo ""
          echo "Created archive:"
          ls -lh "Iris-${{ github.ref_name }}.zip"

      - name: Calculate SHA256 checksum
        id: sha256
        run: |
          cd Iris/build/Build/Products/Release
          SHA256=$(shasum -a 256 "Iris-${{ github.ref_name }}.zip" | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"

      - name: Download Sparkle signing tools
        run: |
          SPARKLE_VERSION="2.9.5"
          SPARKLE_SHA256="015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc"
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p sparkle-dist
          tar -xf sparkle.tar.xz -C sparkle-dist
          ./sparkle-dist/bin/sign_update --help > /dev/null

      - name: Sign update and generate appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set"
            exit 1
          fi

          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.ref_name }}"
          ZIP="Iris/build/Build/Products/Release/Iris-${TAG}.zip"

          # Outputs: sparkle:edSignature="..." length="..."
          ENCLOSURE_ATTRS=$(echo "$SPARKLE_ED_PRIVATE_KEY" | ./sparkle-dist/bin/sign_update --ed-key-file - "$ZIP")
          echo "Enclosure attributes: $ENCLOSURE_ATTRS"

          PUB_DATE=$(LC_ALL=C date -u +"%a, %d %b %Y %H:%M:%S +0000")

          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Iris</title>
              <link>https://raw.githubusercontent.com/ahmetb/Iris/main/appcast.xml</link>
              <description>Updates for Iris</description>
              <language>en</language>
              <item>
                <title>Version ${VERSION}</title>
                <link>https://github.com/ahmetb/Iris/releases/tag/${TAG}</link>
                <sparkle:fullReleaseNotesLink>https://github.com/ahmetb/Iris/releases/tag/${TAG}</sparkle:fullReleaseNotesLink>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <pubDate>${PUB_DATE}</pubDate>
                <enclosure
                  url="https://github.com/ahmetb/Iris/releases/download/${TAG}/Iris-${TAG}.zip"
                  ${ENCLOSURE_ATTRS}
                  type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF

          echo "Generated appcast.xml:"
          cat appcast.xml
          xmllint --noout appcast.xml

      - name: Update Homebrew cask
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.sha256.outputs.sha256 }}"

          # Update version
          sed -i '' "s/version \".*\"/version \"$VERSION\"/" Casks/iris.rb

          # Update SHA256 (handle empty string case)
          if [ -n "$SHA256" ]; then
            sed -i '' "s/sha256 \".*\"/sha256 \"$SHA256\"/" Casks/iris.rb
          fi

          echo "Updated cask:"
          cat Casks/iris.rb

      - name: Commit cask and appcast update
        run: |
          # Determine default branch - try multiple methods
          DEFAULT_BRANCH=""
          if git symbolic-ref refs/remotes/origin/HEAD >/dev/null 2>&1; then
            DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')
          elif git show-ref --verify --quiet refs/remotes/origin/main; then
            DEFAULT_BRANCH="main"
          elif git show-ref --verify --quiet refs/remotes/origin/master; then
            DEFAULT_BRANCH="master"
          else
            DEFAULT_BRANCH="main"
          fi

          echo "Default branch: $DEFAULT_BRANCH"

          # Checkout default branch to commit the cask update
          if git checkout "$DEFAULT_BRANCH" 2>/dev/null; then
            echo "Checked out $DEFAULT_BRANCH"
          elif git checkout main 2>/dev/null; then
            DEFAULT_BRANCH="main"
            echo "Checked out main"
          elif git checkout master 2>/dev/null; then
            DEFAULT_BRANCH="master"
            echo "Checked out master"
          else
            echo "Warning: Could not checkout default branch, skipping cask update commit"
            exit 0
          fi

          # Verify we have a valid branch name
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ -z "$CURRENT_BRANCH" ] || [ "$CURRENT_BRANCH" = "HEAD" ]; then
            echo "Warning: Not on a valid branch, skipping cask update commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/iris.rb appcast.xml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Homebrew cask and appcast to ${{ steps.version.outputs.version }}"
            git push origin "$CURRENT_BRANCH"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Iris/build/Build/Products/Release/Iris-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Installation

            ### Homebrew (Recommended)

            Install via Homebrew using the personal tap:

            ```bash
            brew tap ahmetb/iris https://github.com/ahmetb/Iris
            brew install --cask ahmetb/iris/iris
            ```

            ⚠️ **macOS will show a warning about the unsigned application binary**. This is normal for open-source apps distributed outside the Mac App Store. To solve this:

            1. **First launch**: Right-click (or Control-click) on Iris.app and select "Open"
            2. Click "Open" in the security dialog.
            3. If this doesn't fix your problem, go to `System Settings` search for `Gatekeeper` (which should be under "Privacy & Security" section) and you can see an option to allow "Iris" app to run there under the "Security" section.

            ### Manual Download

            1. Download `Iris-${{ github.ref_name }}.zip` below
            2. Unzip the file
            3. Move `Iris.app` to your Applications folder
            4. **First launch**: Right-click (or Control-click) on Iris.app and select "Open"
            5. Click "Open" in the security dialog

            > ⚠️ macOS may show a warning because the app isn't notarized. This is normal for open-source apps distributed outside the Mac App Store.

            ### Automatic Updates

            Iris checks for new versions automatically (via [Sparkle](https://sparkle-project.org/)) and offers to install them in place. You can also trigger a check from the menu bar icon → "Check for Updates…". Versions 0.2.1 and older don't have the updater — upgrade manually (or `brew upgrade --cask iris`) once to get on the update train.
